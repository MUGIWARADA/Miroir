name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Audit Node dependencies
        run: npm audit --audit-level=moderate
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Regenerate the API contract
        run: npm run generate-schema
      - name: Check the API contract is up to date
        run: git diff --exit-code -- openapi.json

  scoring:
    name: Python scoring
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install -r scoring/requirements.txt -r scoring/requirements-dev.txt pip-audit
      - name: Audit Python dependencies
        run: python -m pip_audit -r scoring/requirements.txt -r scoring/requirements-dev.txt --strict
      - name: Test scoring service
        run: python -m pytest scoring/tests -q
